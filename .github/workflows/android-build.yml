name: Android CI

# Compila, prueba y firma la aplicacion en la nube de GitHub (sin instalar nada en el equipo).
#
# Como funciona:
#   1. Descarga el codigo e instala JDK 17 + cache de Gradle.
#   2. Muestra un diagnostico del entorno (Java, SDK de Android, version de Gradle).
#   3. Compila el APK de depuracion, ejecuta las pruebas unitarias y genera APK/AAB release.
#   4. Si el repositorio tiene los "secrets" del keystore, el release queda FIRMADO con la clave
#      de publicacion; si no, se firma con la clave de depuracion para que el flujo nunca falle
#      (ver docs/COMPILACION.md).
#   5. Sube los archivos como artefactos descargables desde la pestana Actions.
#   6. Si algo falla, publica las ultimas lineas del registro como comentario del PR/commit
#      (asi el error se puede leer sin abrir los logs del runner).

on:
  push:
    branches:
      - main
      - 'arena/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Pruebas y compilacion
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle (cache)
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Dar permisos de ejecucion al wrapper
        run: chmod +x ./gradlew

      - name: Diagnostico del entorno
        continue-on-error: true
        run: |
          set -o pipefail
          {
            echo "===== DIAGNOSTICO DEL ENTORNO ====="
            echo "Fecha: $(date -u)"
            echo "Runner: $RUNNER_OS / $(lsb_release -ds 2>/dev/null || echo desconocido)"
            java -version 2>&1
            echo "JAVA_HOME=$JAVA_HOME"
            echo "ANDROID_HOME=$ANDROID_HOME"
            echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
            echo "-- plataformas instaladas --"
            ls "${ANDROID_HOME:-/usr/local/lib/android/sdk}/platforms" 2>&1 || true
            echo "-- build-tools instaladas --"
            ls "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools" 2>&1 || true
            echo "-- version del wrapper de Gradle --"
            ./gradlew --version 2>&1 || echo "EL WRAPPER DE GRADLE FALLÓ"
            echo "===== FIN DEL DIAGNOSTICO ====="
          } 2>&1 | tee ci.log

      - name: Reconstruir el keystore de publicacion (si existe en los secrets)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > gis-release.jks
            echo "Keystore restaurado: $(ls -l gis-release.jks | awk '{print $5}') bytes" | tee -a ci.log
          else
            echo "No hay keystore en los secrets: se omite este paso." | tee -a ci.log
          fi

      - name: Crear keystore.properties
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            {
              echo "storeFile=gis-release.jks"
              echo "storePassword=$KEYSTORE_PASSWORD"
              echo "keyAlias=$KEY_ALIAS"
              echo "keyPassword=$KEY_PASSWORD"
            } > keystore.properties
            echo "FIRMA=release" >> "$GITHUB_ENV"
            echo "Se firmara con el keystore de publicacion." | tee -a ci.log
          else
            echo "FIRMA=debug" >> "$GITHUB_ENV"
            echo "Sin secrets de keystore: el release se firma con la clave de depuracion." | tee -a ci.log
          fi

      - name: Compilar APK de depuracion (verifica KSP, Hilt y Compose)
        id: build_debug
        continue-on-error: true
        run: |
          set -o pipefail
          echo "===== assembleDebug =====" | tee -a ci.log
          ./gradlew --no-daemon --stacktrace assembleDebug 2>&1 | tee -a ci.log

      - name: Ejecutar pruebas unitarias
        id: unit_tests
        if: steps.build_debug.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          echo "===== testDebugUnitTest =====" | tee -a ci.log
          ./gradlew --no-daemon --stacktrace testDebugUnitTest 2>&1 | tee -a ci.log

      - name: Generar APK y AAB release
        id: build_release
        if: steps.build_debug.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          echo "===== assembleRelease bundleRelease =====" | tee -a ci.log
          ./gradlew --no-daemon --stacktrace assembleRelease bundleRelease 2>&1 | tee -a ci.log

      - name: Listar artefactos generados
        if: steps.build_debug.outcome == 'success'
        run: |
          echo "Tipo de firma usada: $FIRMA"
          find app/build/outputs -type f \( -name "*.apk" -o -name "*.aab" \) -print | tee -a ci.log

      # ------------------------------------------------------------------
      # Si algun paso fallo, se publica el final del registro en el PR (o en
      # el commit) para poder leer el error sin abrir los logs del runner.
      # ------------------------------------------------------------------
      - name: Publicar el error y detener el flujo
        if: >-
          steps.build_debug.outcome != 'success' ||
          steps.unit_tests.outcome != 'success' ||
          steps.build_release.outcome != 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "### ❌ Android CI falló"
            echo ""
            echo "| Paso | Resultado |"
            echo "| --- | --- |"
            echo "| \`assembleDebug\` | ${{ steps.build_debug.outcome }} |"
            echo "| \`testDebugUnitTest\` | ${{ steps.unit_tests.outcome }} |"
            echo "| \`assembleRelease bundleRelease\` | ${{ steps.build_release.outcome }} |"
            echo ""
            echo "#### Errores de compilación (líneas \`e:\` / \`error:\`)"
            echo ""
            echo '```text'
            grep -E "^e: |^error: |error: |What went wrong|^> Task .* FAILED|Caused by: [a-z]" ci.log \
              | grep -v "org.gradle\|java.lang.RuntimeException\|kotlin.KotlinNothingValueException" \
              | head -n 150 || echo "(sin coincidencias)"
            echo '```'
            echo ""
            echo "#### Pruebas fallidas (si las hay)"
            echo ""
            echo '```text'
            grep -E "FAILED$|tests? (completed|failed)|AssertionError|expected:" ci.log | head -n 60 || true
            echo '```'
            echo ""
            echo "#### Mensajes de asercion (XML de resultados)"
            echo ""
            echo '```text'
            if compgen -G "app/build/test-results/testDebugUnitTest/*.xml" > /dev/null; then
              grep -h -B2 -A4 "<failure" app/build/test-results/testDebugUnitTest/*.xml \
                | sed -e "s/&#10;/ /g" -e "s/&lt;/</g" -e "s/&gt;/>/g" -e "s/&amp;/\&/g" \
                | head -n 120
            else
              echo "(sin resultados XML)"
            fi
            echo '```'
            echo ""
            echo "<details><summary>Contexto: 40 líneas alrededor del primer error</summary>"
            echo ""
            echo '```text'
            grep -n -m1 -E "^e: |What went wrong" ci.log | cut -d: -f1 | while read -r n; do
              sed -n "$((n>20 ? n-20 : 1)),$((n+20))p" ci.log
            done
            echo '```'
            echo "</details>"
          } > ci-error.md
          PR_NUMBER="${{ github.event.pull_request.number }}"
          if [ -n "$PR_NUMBER" ]; then
            gh pr comment "$PR_NUMBER" --body-file ci-error.md
          else
            gh api -X POST "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" \
              -F body=@ci-error.md
          fi
          exit 1

      - name: Subir APK de depuracion
        if: steps.build_debug.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: gis-supermercados-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      - name: Subir APK release
        if: steps.build_release.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: gis-supermercados-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: warn

      - name: Subir AAB release (para Google Play)
        if: steps.build_release.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: gis-supermercados-release-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: warn

      - name: Subir informe de pruebas
        if: steps.unit_tests.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: informes-pruebas-unitarias
          path: app/build/reports/tests/
          if-no-files-found: warn

      - name: Subir registro completo de la compilacion
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: registro-compilacion
          path: ci.log
          if-no-files-found: warn
