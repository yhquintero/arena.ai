name: Android CI

# Compila, prueba y firma la aplicacion en la nube de GitHub (sin instalar nada en el equipo).
#
# Como funciona:
#   1. Descarga el codigo.
#   2. Instala JDK 17 y la cache de Gradle.
#   3. Ejecuta las pruebas unitarias (logica de dinero, ventas, periodos y validaciones).
#   4. Genera el APK de depuracion (siempre) y el APK/AAB release.
#   5. Si el repositorio tiene configurados los "secrets" del keystore, el release queda FIRMADO
#      con la clave de publicacion; si no, se firma con la clave de depuracion para que el flujo
#      nunca falle (ver docs/COMPILACION.md).
#   6. Sube los archivos como artefactos descargables desde la pestaña Actions.

on:
  push:
    branches:
      - main
      - 'arena/**'
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Pruebas y compilacion
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle (cache)
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Dar permisos de ejecucion al wrapper
        run: chmod +x ./gradlew

      - name: Reconstruir el keystore de publicacion (si existe en los secrets)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > gis-release.jks
            echo "Keystore restaurado: $(ls -l gis-release.jks | awk '{print $5}') bytes"
          else
            echo "No hay keystore en los secrets: se omite este paso."
          fi

      - name: Crear keystore.properties
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            {
              echo "storeFile=gis-release.jks"
              echo "storePassword=$KEYSTORE_PASSWORD"
              echo "keyAlias=$KEY_ALIAS"
              echo "keyPassword=$KEY_PASSWORD"
            } > keystore.properties
            echo "FIRMA=release" >> "$GITHUB_ENV"
            echo "Se firmara con el keystore de publicacion."
          else
            echo "FIRMA=debug" >> "$GITHUB_ENV"
            echo "No hay secrets de keystore: el release se firma con la clave de depuracion."
          fi

      - name: Verificar el proyecto (compilacion + KSP + Hilt)
        run: ./gradlew --no-daemon assembleDebug --stacktrace

      - name: Ejecutar pruebas unitarias
        run: ./gradlew --no-daemon testDebugUnitTest --stacktrace

      - name: Generar APK y AAB release
        run: ./gradlew --no-daemon assembleRelease bundleRelease --stacktrace

      - name: Listar artefactos generados
        run: |
          echo "Tipo de firma usada: $FIRMA"
          find app/build/outputs -type f \( -name "*.apk" -o -name "*.aab" \) -print

      - name: Subir APK de depuracion
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gis-supermercados-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      - name: Subir APK release
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gis-supermercados-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: warn

      - name: Subir AAB release (para Google Play)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gis-supermercados-release-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: warn

      - name: Subir informe de pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: informes-pruebas-unitarias
          path: app/build/reports/tests/
          if-no-files-found: warn
